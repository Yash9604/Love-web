<!DOCTYPE html>
<html>
<head>
<title>Beautiful Website</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ff6b81,#ff9ff3,#feca57);
  font-family:Arial, sans-serif;
  overflow:hidden;
}

/* Floating Hearts */
.heart{
  position:absolute;
  bottom:-20px;
  font-size:20px;
  animation:float 6s linear infinite;
}

@keyframes float{
  from{transform:translateY(0);opacity:1;}
  to{transform:translateY(-100vh);opacity:0;}
}

/* Glass Box */
.box{
  background:rgba(255,255,255,0.25);
  padding:50px;
  border-radius:20px;
  backdrop-filter:blur(15px);
  box-shadow:0 10px 30px rgba(0,0,0,0.2);
  text-align:center;
  color:white;
}

/* Title */
h2{
  font-size:28px;
  margin-bottom:25px;
}

/* Buttons */
button{
  padding:14px 26px;
  margin:10px;
  border:none;
  border-radius:30px;
  background:white;
  color:#ff6b81;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}

/* Hover effect */
button:hover{
  transform:scale(1.15);
  box-shadow:0 6px 18px rgba(0,0,0,0.25);
}
</style>
</head>

<body>

<div class="box">
  <h2>💖 Do you like me? 😊</h2>

  <button onclick="openLove()">Yes</button>
  <button id="noBtn" onclick="moveNo()">No</button>
</div>

<script>
/* Open love page */
function openLove(){
  window.location.href="love.html";
}

/* Move No button */
function moveNo(){
  let btn=document.getElementById("noBtn");
  let x=Math.random()*250-125;
  let y=Math.random()*250-125;
  btn.style.transform="translate("+x+"px,"+y+"px)";
}

/* Floating hearts animation */
function createHeart(){
  let heart=document.createElement("div");
  heart.className="heart";
  heart.innerHTML="💗";
  heart.style.left=Math.random()*100+"vw";
  heart.style.animationDuration=(3+Math.random()*3)+"s";
  document.body.appendChild(heart);

  setTimeout(()=>heart.remove(),6000);
}
setInterval(createHeart,30
